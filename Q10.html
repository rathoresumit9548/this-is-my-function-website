!DOCTYPE <html>
<html lang="en">
    <head>
        <title>Simple interest Calculator</title>
        <h1>Simple interest Calculator</h1>
    </head>
    <body>
        <script>
            function calculaterSimpleInterest(principal, rate, time){
                return (principal * rate * time) / 100;
            }
            let interest = calculaterSimpleInterest(5000 ,10 , 2);
            console.log("Simple Interest =" , interest);
        </script>
    </body>
</html>
