!DOCTYPE <html>
<html lang="en">
    <head>
        <title>Multiple Table</title>
        <h1>multiple table</h1>
        
    </head>
    <body>
        <script>
            function displayTable(num){
                for(let i = 1; i <= 10; i++){
                    console.log(num + " * " + i + " = " + (num * i));
                }
            }
            displayTable(5);
        </script>
    </body>
</html>
