!DOCTYPE <html>
<html lang="en">
    <head>
        <title>Even odd</title>
        <h1>EVEN ODD</h1>
    </head>
    <body>
        <script>
            function checkEvenOdd(num) {
                if (num % 2 === 0) {
                    return "Even";
                }
                else{
                    return "Odd";
                }
            }
            console.log(checkEvenOdd(7));
            console.log(checkEvenOdd(12));
        </script>
    </body>
</html>
