!DOCTYPE <html>
<html lang="en">
    <head>
        <title>Reverse</title>
        <h1>Reverse Countdown</h1>
    </head>
    <body>
        <script>
            function printcountDown(startNumber){
                let i = startNumber;
                while(i >= 1){
                    console.log(i);
                    i--;
                }
            }
            printcountDown(5);
        </script>
    </body>
</html>
